[project]
name = "pydantic-ai-tech-intel-briefing"
version = "0.2.0"
description = "A Pydantic AI assistant for public-source technology intelligence and daily Chinese briefings."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
authors = [{name = "redmaplewww"}]
dependencies = [
  "agent-framework-core==1.9.0",
  "agent-framework-openai==1.8.2",
  "fastapi==0.138.1",
  "lark-oapi==1.6.8",
  "pydantic==2.13.4",
  "pydantic-ai-slim[openai,mcp]==1.107.1",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "httpx==0.28.1",
]

[project.urls]
Homepage = "https://github.com/redmaplewww/pydantic-ai-tech-intel-briefing"
Repository = "https://github.com/redmaplewww/pydantic-ai-tech-intel-briefing"
Issues = "https://github.com/redmaplewww/pydantic-ai-tech-intel-briefing/issues"

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
